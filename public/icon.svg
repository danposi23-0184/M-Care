<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057B8"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F5"/>
    </linearGradient>
    <linearGradient id="motherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner Soft Container -->
  <circle cx="256" cy="256" r="190" fill="url(#circleGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Medical Pulse / Halo Accent -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#F43F5E" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Mother and Child Silhouette (Stylized OB-GYNE Emblem) -->
  <g transform="translate(146, 126) scale(0.44)" fill="url(#motherGrad)">
    <!-- Mother Head -->
    <circle cx="230" cy="110" r="46"/>
    <!-- Baby Head -->
    <circle cx="295" cy="245" r="34"/>
    
    <!-- Mother Torso & Embracing Arms -->
    <path d="M 210 170 C 170 190, 140 250, 140 330 C 140 440, 210 500, 275 500 C 315 500, 355 470, 360 410 C 365 350, 335 320, 305 320 C 275 320, 260 345, 240 345 C 220 345, 205 325, 205 295 C 205 240, 235 200, 265 190 C 250 180, 230 172, 210 170 Z"/>
    
    <!-- Baby Body Embraced by Mother -->
    <path d="M 295 285 C 330 290, 355 330, 350 375 C 345 410, 315 435, 280 435 C 270 435, 260 430, 255 425 C 275 390, 285 340, 280 290 C 285 287, 290 286, 295 285 Z" fill="#F43F5E"/>
    
    <!-- Gentle Loving Heart Accent -->
    <path d="M 225 395 C 225 385, 235 375, 245 375 C 252 375, 258 380, 260 385 C 262 380, 268 375, 275 375 C 285 375, 295 385, 295 395 C 295 412, 265 430, 260 435 C 255 430, 225 412, 225 395 Z" fill="#FB7185"/>
  </g>
</svg>
